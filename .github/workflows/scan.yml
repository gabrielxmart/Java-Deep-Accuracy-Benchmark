name: XGuardian SAST Accuracy Benchmark

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xguardian-sast-accuracy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sast-accuracy-scan:
    name: Run XGuardian SAST Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Repository secrets are not exposed to PRs from forks.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout benchmark
        uses: actions/checkout@v4

      # ============================================================
      # Materialize benchmark cases
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize benchmark cases
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating benchmark cases..."
          python corpus/generate_cases.py

      # ============================================================
      # Prepare payload
      # ============================================================

      - name: Prepare cases-only scan payload
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "cases" ]]; then
            echo "::error::cases/ directory was not generated"
            exit 1
          fi

          FILE_COUNT="$(find cases -type f | wc -l)"

          if [[ "${FILE_COUNT}" -eq 0 ]]; then
            echo "::error::cases/ directory is empty"
            exit 1
          fi

          # Keep the same behavior from the previous benchmark workflow.
          rm -f cases/typescript/tsconfig.json

          echo "XGuardian scan payload prepared successfully."
          echo "Scan directory: cases/"
          echo "Files to be scanned: $(find cases -type f | wc -l)"
          echo
          echo "Payload:"
          find cases -type f | sort

      # ============================================================
      # XGuardian configuration
      # ============================================================

      - name: Validate XGuardian configuration
        shell: bash
        env:
          XGUARDIAN_TOKEN: ${{ secrets.XGUARDIAN_TOKEN }}
          XGUARDIAN_APP_ID: ${{ vars.XGUARDIAN_APP_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${XGUARDIAN_TOKEN}" ]]; then
            echo "::error::Missing repository secret XGUARDIAN_TOKEN"
            exit 1
          fi

          if [[ ! "${XGUARDIAN_APP_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::XGUARDIAN_APP_ID must be a positive numeric application ID"
            exit 1
          fi

          echo "XGuardian configuration is valid."
          echo "Application ID: ${XGUARDIAN_APP_ID}"

      # ============================================================
      # XGuardian SAST
      # ============================================================

      - name: Run XGuardian SAST benchmark
        id: xguardian
        uses: xguardian-actions/actions/sast@development
        with:
          token: ${{ secrets.XGUARDIAN_TOKEN }}
          app_id: ${{ vars.XGUARDIAN_APP_ID }}
          scan_directory: "cases"
          translate: "true"
          pdf: "true"
          get_scan_id: "true"

      # ============================================================
      # Summary
      # ============================================================

      - name: Publish XGuardian scan metadata
        if: success()
        shell: bash
        env:
          APP_ID: ${{ steps.xguardian.outputs.app_id }}
          SCAN_ID: ${{ steps.xguardian.outputs.scan_id }}
          SCAN_URL: ${{ steps.xguardian.outputs.scan_url }}
          SCAN_VERSION: ${{ steps.xguardian.outputs.scan_version }}
        run: |
          {
            echo "## XGuardian SAST Accuracy Benchmark"
            echo
            echo "- Environment: \`development\`"
            echo "- App ID: \`${APP_ID}\`"
            echo "- Scan ID: \`${SCAN_ID}\`"
            echo "- Scan version: \`${SCAN_VERSION}\`"
            echo "- Results: ${SCAN_URL}"
            echo "- Scanned directory: \`cases/\` only"
            echo "- XGuardian Action: \`xguardian-actions/actions/sast@development\`"
          } >> "$GITHUB_STEP_SUMMARY"
